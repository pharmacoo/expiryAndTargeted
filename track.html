<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الأدوية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #1a73e8;
            --light-blue: #e8f0fe;
            --dark-blue: #0d47a1;
            --white: #ffffff;
            --gray: #f5f5f5;
            --text-dark: #202124;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --danger: #ff4d4d;
            --warning: #ff9800;
            --success: #4caf50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-blue);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, var(--primary-blue), var(--dark-blue));
            color: var(--white);
            padding: 20px 0;
            border-radius: 0 0 20px 20px;
            box-shadow: var(--shadow);
            animation: fadeIn 1s ease-out;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo i {
            font-size: 2.5rem;
        }

        .logo h1 {
            font-size: 1.8rem;
        }

        .update-notice {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 10px 15px;
            border-radius: 30px;
            font-size: 0.9rem;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .dashboard-card {
            background: var(--white);
            border-radius: 15px;
            padding: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
        }

        .dashboard-card.expiring {
            border-top: 5px solid var(--danger);
        }

        .dashboard-card.targeted {
            border-top: 5px solid var(--warning);
        }

        .dashboard-card.total {
            border-top: 5px solid var(--primary-blue);
        }

        .dashboard-card.expiring-60 {
            border-top: 5px solid var(--success);
        }

        .card-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .expiring .card-value { color: var(--danger); }
        .targeted .card-value { color: var(--warning); }
        .total .card-value { color: var(--primary-blue); }
        .expiring-60 .card-value { color: var(--success); }

        .card-label {
            color: #666;
            font-size: 1.1rem;
        }

        .card-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            margin: 30px 0 20px;
            background-color: var(--white);
            border-radius: 50px;
            padding: 5px;
            box-shadow: var(--shadow);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 15px;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.4s ease;
            font-weight: bold;
        }

        .tab.active {
            background-color: var(--primary-blue);
            color: var(--white);
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .screen.active {
            display: block;
        }

        .search-container {
            background-color: var(--white);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
        }

        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid var(--light-blue);
            border-radius: 50px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--primary-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.2);
        }

        .search-btn {
            background-color: var(--primary-blue);
            color: var(--white);
            border: none;
            border-radius: 50px;
            padding: 0 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background-color: var(--dark-blue);
            transform: translateY(-2px);
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter {
            flex: 1;
            min-width: 150px;
        }

        .filter select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--light-blue);
            border-radius: 10px;
            background-color: var(--white);
            transition: all 0.3s ease;
        }

        .filter select:focus {
            border-color: var(--primary-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.2);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .product-card {
            background-color: var(--white);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
        }

        .product-image {
            height: 180px;
            overflow: hidden;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.5s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.05);
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--dark-blue);
        }

        .product-scientific {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .product-details {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
            flex: 1;
            min-width: 120px;
        }

        .detail-label {
            font-size: 0.8rem;
            color: #777;
            margin-bottom: 3px;
        }

        .detail-value {
            font-weight: bold;
        }

        .days-remaining {
            color: var(--danger);
            font-weight: bold;
        }

        .days-warning {
            color: var(--warning);
        }

        .days-normal {
            color: var(--success);
        }

        .product-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .status-text {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9rem;
        }

        .status-expiring {
            background-color: #ffebee;
            color: var(--danger);
        }

        .status-low {
            background-color: #fff3e0;
            color: var(--warning);
        }

        .status-good {
            background-color: #e8f5e9;
            color: var(--success);
        }

        .status-high {
            background-color: #e3f2fd;
            color: var(--primary-blue);
        }

        .expiry-badge {
            background-color: var(--danger);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            position: absolute;
            top: 10px;
            left: 10px;
            animation: pulse 2s infinite;
        }

        .warning-badge {
            background-color: var(--warning);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .offer-badge {
            background-color: var(--success);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .floating-notice {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: var(--primary-blue);
            color: var(--white);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            animation: float 3s ease-in-out infinite;
        }

        .no-products {
            text-align: center;
            padding: 40px;
            background-color: var(--white);
            border-radius: 15px;
            box-shadow: var(--shadow);
            color: #666;
        }

        .no-products i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #ccc;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(255, 77, 77, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 77, 77, 0);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }
           50% {
                transform: translateY(-10px);
            }
            100% {
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            
            .dashboard {
                grid-template-columns: 1fr 1fr;
            }
            
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
            
            .filters {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .tabs {
                flex-direction: column;
                border-radius: 15px;
            }
            
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .products-grid {
                grid-template-columns: 1fr;
            }
            
            .search-box {
                flex-direction: column;
            }
            
            .search-btn {
                width: 100%;
                padding: 15px;
            }
            
            .product-details {
                flex-direction: column;
            }
        }
    </style>
</head>

        <div class="tabs">

        <!-- شاشة الأدوية قريبة الانتهاء -->
        <div class="screen active" id="expiring-screen">
            <div class="search-container">

                    <button class="search-btn"><i class="fas fa-search"></i> بحث</button>
                </div>
                <div class="filters">

                            <option value="highToLow">الأعلى كمية</option>
                            <option value="lowToHigh">الأقل كمية</option>
                        </select>
                    </div>
                    <div class="filter">

                            <option value="expiring60">تنتهي خلال 60 يوم</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="products-grid" id="expiring-products">
                <!-- سيتم تعبئة المنتجات dynamically -->
            </div>
        </div>

        <!-- شاشة الأدوية المستهدفة -->
        <div class="screen" id="targeted-screen">
            <div class="search-container">
                <div class="search-box">

                    <div class="filter">

                        </select>
                    </div>
                </div>
            </div>

            <div class="products-grid" id="targeted-products">
                <!-- سيتم تعبئة المنتجات dynamically -->
            </div>
        </div>
    </div>

        // وظائف JavaScript
        document.addEventListener('DOMContentLoaded', function() {
            // تحميل المنتجات
            loadProducts(expiringDrugs, 'expiring-products');
            loadProducts(targetedDrugs, 'targeted-products');
            
            // تحديث قائمة الأسماء العلمية في الفلاتر
            updateScientificFilters();
            
            // تحديث الإحصائيات
            updateStatistics();
            
            // إضافة أحداث للتبويبات
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    const screenId = `${tab.dataset.tab}-screen`;
                    document.querySelectorAll('.screen').forEach(screen => {
                        screen.classList.remove('active');
                    });
                    document.getElementById(screenId).classList.add('active');
                });
            });
            
            // إضافة أحداث للفرز والتصفية
            document.getElementById('sortQuantity').addEventListener('change', filterProducts);
            document.getElementById('filterScientific').addEventListener('change', filterProducts);
            document.getElementById('filterExpiry').addEventListener('change', filterProducts);
            
            document.getElementById('sortQuantity2').addEventListener('change', filterProducts);
            document.getElementById('filterScientific2').addEventListener('change', filterProducts);
            document.getElementById('filterOffer').addEventListener('change', filterProducts);
            
            // إضافة أحداث للبحث
            document.querySelectorAll('.search-input').forEach(input => {
                input.addEventListener('keyup', filterProducts);
            });
            
            document.querySelectorAll('.search-btn').forEach(btn => {
                btn.addEventListener('click', filterProducts);
            });
        });

        // حساب الأيام المتبقية حتى الانتهاء
        function calculateDaysRemaining(expiryDate) {
            const today = new Date();
            const expiry = new Date(expiryDate);
            const diffTime = expiry - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays;
        }

        // تحديد فئة الأيام المتبقية للألوان
        function getDaysClass(days) {
            if (days < 7) return "days-remaining";
            if (days < 30) return "days-warning";
            return "days-normal";
        }

        // تحديد حالة الدواء بناءً على الأيام المتبقية والكمية
        function getDrugStatus(drug, daysRemaining) {
            if (daysRemaining <= 60) {
                return {
                    text: "ينتهي قريباً",
                    class: "status-expiring"
                };
            }
            
            if (drug.quantity < 20) {
                return {
                    text: "كمية منخفضة",
                    class: "status-low"
                };
            }
            
            if (drug.quantity >= 20 && drug.quantity < 50) {
                return {
                    text: "كمية متوسطة",
                    class: "status-good"
                };
            }
            
            return {
                text: "كمية كبيرة",
                class: "status-high"
            };
        }

        // وظيفة تحميل المنتجات
        function loadProducts(products, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            if (products.length === 0) {
                container.innerHTML = `
                    <div class="no-products">
                        <i class="fas fa-box-open"></i>
                        <h3>لا توجد أدوية لعرضها</h3>
                        <p>يمكنك إضافة أدوية جديدة باستخدام نموذج الإضافة</p>
                    </div>
                `;
                return;
            }
            
            products.forEach(product => {
                const productCard = createProductCard(product);
                container.appendChild(productCard);
            });
        }

        // إنشاء بطاقة منتج
        function createProductCard(product) {
            const productCard = document.createElement('div');
            productCard.className = 'product-card';
            
            // حساب الأيام المتبقية للانتهاء
            const daysRemaining = calculateDaysRemaining(product.expiry_date);
            const daysClass = getDaysClass(daysRemaining);
            
            // تحديد حالة الدواء
            const drugStatus = getDrugStatus(product, daysRemaining);
            
            productCard.innerHTML = `
                <div class="product-image">
                    <img src="${product.image}" alt="${product.trade_name}" onerror="this.src='https://via.placeholder.com/300x180?text=صورة+الدواء'">
                    ${daysRemaining <= 60 ? `<div class="expiry-badge">ينتهي خلال ${daysRemaining} يوم</div>` : ''}
                    ${product.offer === 'Yes' ? `<div class="warning-badge">عرض خاص</div>` : ''}
                </div>
                <div class="product-info">
                    <h3 class="product-name">${product.trade_name}</h3>
                    <p class="product-scientific">${product.scientific_name}</p>
                    
                    <div class="product-details">
                        <div class="detail-item">
                            <span class="detail-label">الكمية</span>
                            <span class="detail-value">${product.quantity} وحدة</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">تاريخ الانتهاء</span>
                            <span class="detail-value">${product.expiry_date}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">الأيام المتبقية</span>
                            <span class="detail-value ${daysClass}">${daysRemaining} يوم</span>
                        </div>
                    </div>
                    
                    <div class="product-status">
                        <span>الحالة:</span>
                        <span class="status-text ${drugStatus.class}">${drugStatus.text}</span>
                    </div>
                </div>
            `;
            
            return productCard;
        }

        // وظيفة التصفية والفرز
        function filterProducts() {
            // تطبيق الفلاتر على الأدوية قريبة الانتهاء
            const sortQuantity = document.getElementById('sortQuantity').value;
            const filterScientific = document.getElementById('filterScientific').value;
            const filterExpiry = document.getElementById('filterExpiry').value;
            const searchText = document.querySelector('#expiring-screen .search-input').value.toLowerCase();
            
            let filteredExpiring = [...expiringDrugs];
            
            // التصفية حسب البحث
            if (searchText) {
                filteredExpiring = filteredExpiring.filter(product => 
                    product.trade_name.toLowerCase().includes(searchText) || 
                    product.scientific_name.toLowerCase().includes(searchText)
                );
            }
            
            // التصفية حسب الاسم العلمي
            if (filterScientific) {
                filteredExpiring = filteredExpiring.filter(product => 
                    product.scientific_name === filterScientific
                );
            }
            
            // التصفية حسب تاريخ الانتهاء
            if (filterExpiry) {
                const today = new Date();
                filteredExpiring = filteredExpiring.filter(product => {
                    const expiryDate = new Date(product.expiry_date);
                    const diffTime = expiryDate - today;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    if (filterExpiry === 'week') return diffDays <= 7;
                    if (filterExpiry === 'month') return diffDays <= 30;
                    if (filterExpiry === 'expiring60') return diffDays <= 60;
                    return true;
                });
            }
            
            // الفرز حسب الكمية
            if (sortQuantity === 'highToLow') {
                filteredExpiring.sort((a, b) => b.quantity - a.quantity);
            } else if (sortQuantity === 'lowToHigh') {
                filteredExpiring.sort((a, b) => a.quantity - b.quantity);
            }
            
            loadProducts(filteredExpiring, 'expiring-products');
            
            // تطبيق الفلاتر على الأدوية المستهدفة
            const sortQuantity2 = document.getElementById('sortQuantity2').value;
            const filterScientific2 = document.getElementById('filterScientific2').value;
            const filterOffer = document.getElementById('filterOffer').value;
            const searchText2 = document.querySelector('#targeted-screen .search-input').value.toLowerCase();
            
            let filteredTargeted = [...targetedDrugs];
            
            // التصفية حسب البحث
            if (searchText2) {
                filteredTargeted = filteredTargeted.filter(product => 
                    product.trade_name.toLowerCase().includes(searchText2) || 
                    product.scientific_name.toLowerCase().includes(searchText2)
                );
            }
            
            // التصفية حسب الاسم العلمي
            if (filterScientific2) {
                filteredTargeted = filteredTargeted.filter(product => 
                    product.scientific_name === filterScientific2
                );
            }
            
            // التصفية حسب العرض
            if (filterOffer === 'offer') {
                filteredTargeted = filteredTargeted.filter(product => product.offer === 'Yes');
            }
            
            // الفرز حسب الكمية
            if (sortQuantity2 === 'highToLow') {
                filteredTargeted.sort((a, b) => b.quantity - a.quantity);
            } else if (sortQuantity2 === 'lowToHigh') {
                filteredTargeted.sort((a, b) => a.quantity - b.quantity);
            }
            
            loadProducts(filteredTargeted, 'targeted-products');
        }

        // تحديث قائمة الفلاتر بالأسماء العلمية
        function updateScientificFilters() {
            const allScientificNames = [...new Set([
                ...expiringDrugs.map(p => p.scientific_name),
                ...targetedDrugs.map(p => p.scientific_name)
            ])];
            
            const filterScientific = document.getElementById('filterScientific');
            const filterScientific2 = document.getElementById('filterScientific2');
            
            // مسح الخيارات الحالية
            filterScientific.innerHTML = '<option value="">جميع الأسماء العلمية</option>';
            filterScientific2.innerHTML = '<option value="">جميع الأسماء العلمية</option>';
            
            // إضافة الخيارات الجديدة
            allScientificNames.forEach(name => {
                filterScientific.innerHTML += `<option value="${name}">${name}</option>`;
                filterScientific2.innerHTML += `<option value="${name}">${name}</option>`;
            });
        }

        // تحديث الإحصائيات
        function updateStatistics() {
            // جميع الأدوية
            const allDrugs = [...expiringDrugs, ...targetedDrugs];
            
            // الأدوية التي تنتهي خلال 60 يوم
            const expiringIn60Days = allDrugs.filter(drug => {
                const days = calculateDaysRemaining(drug.expiry_date);
                return days <= 60;
            }).length;
            
            // تحديث DOM
            document.getElementById('total-count').textContent = allDrugs.length;
            document.getElementById('expiring-count').textContent = expiringDrugs.length;
            document.getElementById('targeted-count').textContent = targetedDrugs.length;
            document.getElementById('expiring-60-count').textContent = expiringIn60Days;
        }
    </script>
